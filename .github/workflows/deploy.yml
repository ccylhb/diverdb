name: Deploy to Cloudflare Pages

# 仅手动触发：本项目的生产部署走本地 wrangler（wrangler pages deploy dist），
# 曾配置的 push 自动部署因 secrets 未配置从未成功，保留为手动兜底。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: diverdb
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
